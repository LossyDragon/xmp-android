[versions]
activityCompose = "1.12.0" # https://mvnrepository.com/artifact/androidx.activity/activity-compose
androidGradlePlugin = "8.13.1" # https://mvnrepository.com/artifact/com.android.application/com.android.application.gradle.plugin
cascadeCompose = "2.3.0" # https://mvnrepository.com/artifact/me.saket.cascade/cascade-compose
composeBom = "2025.11.01" # https://mvnrepository.com/artifact/androidx.compose/compose-bom
composeNavigation = "2.9.6" # https://mvnrepository.com/artifact/androidx.navigation/navigation-compose
coreKtx = "1.17.0" # https://mvnrepository.com/artifact/androidx.core/core-ktx
dataStore = "1.2.0" # https://mvnrepository.com/artifact/androidx.datastore/datastore-preferences
dfc = "1.2" # https://mvnrepository.com/artifact/com.lazygeniouz/dfc
extendedSpans = "1.4.0" # https://mvnrepository.com/artifact/me.saket.extendedspans/extendedspans
kotlin = "2.2.21" # https://mvnrepository.com/artifact/org.jetbrains.kotlin.android/org.jetbrains.kotlin.android.gradle.plugin
kotlinterGradle = "5.3.0" # // https://github.com/jeremymailen/kotlinter-gradle
kotlinxSerialization = "1.9.0" # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-serialization-json
ktor = "3.3.2" # https://mvnrepository.com/artifact/io.ktor/ktor-client-core
leakcanaryAndroid = "2.14" # https://mvnrepository.com/artifact/com.squareup.leakcanary/leakcanary-android
lifecycleRuntimeCompose = "2.10.0" # https://mvnrepository.com/artifact/androidx.lifecycle/lifecycle-runtime-compose
lifecycleRuntimeKtx = "2.10.0" # https://mvnrepository.com/artifact/androidx.lifecycle/lifecycle-runtime-ktx
lifecycleViewModelCompose = "2.10.0" # https://mvnrepository.com/artifact/androidx.lifecycle/lifecycle-viewmodel-compose
materialKolor = "4.0.4" # https://mvnrepository.com/artifact/com.materialkolor/material-kolor
media = "1.7.1" # https://mvnrepository.com/artifact/androidx.media/media
reorderable = "3.0.0" # https://mvnrepository.com/artifact/sh.calvin.reorderable/reorderable
settings = "2.15.0" # https://github.com/alorma/Compose-Settings/releases
timber = "5.0.1" # https://mvnrepository.com/artifact/com.jakewharton.timber/timber

[libraries]
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-animation-animation = { module = "androidx.compose.animation:animation" }
compose-animation-graphics = { module = "androidx.compose.animation:animation-graphics" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
compose-settings-ui = { module = "com.github.alorma.compose-settings:ui-tiles", version.ref = "settings" }
compose-settings-ui-extended = { module = "com.github.alorma.compose-settings:ui-tiles-extended", version.ref = "settings" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-ui = { module = "androidx.compose.ui:ui" }

ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml", version.ref = "ktor" }

cascade-compose = { module = "me.saket.cascade:cascade-compose", version.ref = "cascadeCompose" }
compose-extended-spans = { module = "me.saket.extendedspans:extendedspans", version.ref = "extendedSpans" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
dfc = { module = "com.lazygeniouz:dfc", version.ref = "dfc" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-xml = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelCompose" }
materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
media = { module = "androidx.media:media", version.ref = "media" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

[bundles]
compose = [
    "compose-activity",
    "compose-animation-animation",
    "compose-animation-graphics",
    "compose-foundation",
    "compose-material-icons-core",
    "compose-material-icons-extended",
    "compose-material3",
    "compose-runtime-livedata",
    "compose-settings-ui",
    "compose-settings-ui-extended",
    "compose-ui-tooling",
    "compose-ui-ui",
    "compose-navigation"
]
compose-utils = [
    "cascade-compose",
    "compose-extended-spans",
    "lifecycle-runtime-compose",
    "materialKolor",
]
ktor = [
    "kotlinx-serialization-xml",
    "ktor-client-android",
    "ktor-client-negotiation",
    "ktor-serialization-xml",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
gradle-kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinterGradle" }
kotlin-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
