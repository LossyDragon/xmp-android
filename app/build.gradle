apply plugin: 'com.android.application'

android {
    namespace "org.helllabs.android.xmp"
    compileSdkVersion 34
    defaultConfig {
        applicationId "org.helllabs.android.xmp"
        minSdkVersion 14
        targetSdkVersion 27

        ndk {
            moduleName "xmp-prebuilt"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
        }
    }
    // Temporarily disable ndk build
    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }
    productFlavors {
    }

    // https://developer.android.com/reference/tools/gradle-api/7.4/com/android/build/api/dsl/BuildFeatures
    buildFeatures {
        aidl true
    }

    // Override apikey.xml with a TMA provided key. Usually in your global gradle.properties.file
    defaultConfig {
        resValue "string", "modarchive_apikey", project.findProperty("modArchiveApiKey") ?: "apikey"
    }
}

dependencies {
    implementation project(":material-preferences")

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation('com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0@aar') {
        transitive = true
    }
    implementation("com.github.pluscubed:recycler-fast-scroll:0.3.2")

    implementation("com.telly:groundy:1.5")
    implementation("com.android.volley:volley:1.2.1")
}
